<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow" />
		<title>%sveltekit.error.message%</title>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			body {
				font-family:
					ui-sans-serif,
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					Roboto,
					sans-serif;
				background: #fafafa;
				color: #18181b;
				display: flex;
				min-height: 100vh;
				align-items: center;
				justify-content: center;
				padding: 1rem;
			}
			.container {
				max-width: 28rem;
				text-align: center;
			}
			.status {
				font-size: 5rem;
				font-weight: 700;
				letter-spacing: -0.05em;
				color: #d4d4d8;
				line-height: 1;
			}
			.heading {
				margin-top: 0.5rem;
				font-size: 1.25rem;
				font-weight: 600;
			}
			.message {
				margin-top: 0.5rem;
				font-size: 0.875rem;
				color: #71717a;
			}
			.link {
				display: inline-block;
				margin-top: 1.5rem;
				padding: 0.5rem 1rem;
				background: #18181b;
				color: #fafafa;
				text-decoration: none;
				border-radius: 0.375rem;
				font-size: 0.875rem;
				font-weight: 500;
			}
			.link:hover {
				opacity: 0.9;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<p class="status">%sveltekit.status%</p>
			<h1 class="heading">Something went wrong</h1>
			<p class="message">%sveltekit.error.message%</p>
			<a href="/" class="link">Back to home</a>
		</div>
	</body>
</html>
